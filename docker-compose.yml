version: '3.8'

services:
  api:
    build:
      context: .
      target: development
    container_name: commerce-api
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgres://postgres:2468@postgres:5432/commerce_dev
      - REDIS_URL=redis://redis:6379
      - JWT_ACCESS_SECRET=super_secret_access_key_dev
      - JWT_REFRESH_SECRET=super_secret_refresh_key_dev
      - JWT_ACCESS_EXPIRATION=15m
      - JWT_REFRESH_EXPIRATION=7d
      - PORT=3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh -c "npm run migration:run && npm run start:dev"
    volumes:
      - .:/app
      - /app/node_modules

  postgres:
    image: postgres:16-alpine
    container_name: commerce-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-2468}
      POSTGRES_DB: ${POSTGRES_DB:-commerce_dev}
    ports:
      - '56432:5432'
    volumes:
      - commerce-pg-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-commerce_dev}',
        ]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: commerce-redis
    ports:
      - '6379:6379'
    volumes:
      - commerce-redis-data:/data
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  commerce-pg-data:
  commerce-redis-data:
